# MkDocs configuration for the UAEF documentation site.
#
# Layout: this file lives in docs/ and the page sources live in docs/docs/.
# That nesting is what lets CI run `cd docs && mkdocs gh-deploy` from the repo
# root. See README.md in this directory.
site_name: UAEF
site_description: Universal Agent Evaluation Framework — framework-agnostic evaluation for AI agents
# Published to GitHub Pages from the gh-pages branch by .github/workflows/docs.yml,
# so the site is served under the /uaef/ project path.
site_url: https://awslabs.github.io/uaef/
repo_url: https://github.com/awslabs/uaef
repo_name: awslabs/uaef
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    # Light mode (auto-selected when system prefers light)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode (auto-selected when system prefers dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      title: On this page
      permalink: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # Navigation is generated from the directory tree plus .nav.yml files.
  - awesome-nav
  # API reference pages under docs/API-Reference/ are `::: uaef.<module>`
  # directives resolved against the real source tree.
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            # UAEF re-exports the public surface from package __init__ files;
            # following aliases documents them where they are imported.
            filters: ["!^_"]

extra_javascript:
  # Loaded explicitly rather than relying on the theme, because setting site_url breaks
  # mermaid rendering. Background:
  # https://github.com/squidfunk/mkdocs-material/issues/3742#issuecomment-1076068038
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
