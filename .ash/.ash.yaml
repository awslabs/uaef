# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: uaef
global_settings:
  severity_threshold: MEDIUM
  # Scope scanners to first-party production code. Everything below is either
  # not shipped, not first-party, or ASH's own output — excluding it has no
  # impact on the uaef package and removes scanner noise (not real fixes).
  ignore_paths:
    # Only non-source / scanner-generated paths are excluded here. Everything
    # first-party that we deliver (including tests) is scanned.
    - path: 'node_modules/**'
      reason: 'Installed third-party JS packages; not tracked in git, not first-party source (real deps are scanned via committed lockfiles)'
    - path: '**/node_modules/**'
      reason: 'Installed third-party JS packages; not tracked in git, not first-party source'
    - path: '.ash/**'
      reason: "ASH's own scan output and converted artifacts (self-referential)"
    - path: '.venv/**'
      reason: 'Local Python virtual environment (installed third-party packages); gitignored, not first-party source. Real dependency risk is tracked via the committed uv.lock, which is scanned.'
    - path: '**/.venv/**'
      reason: 'Local Python virtual environments in subprojects; installed packages, not first-party source.'
  suppressions:
    # Doc example: PostgreSQL connection snippet with a placeholder password.
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'docs/docs/Guides/experiments.md'
      line_start: 536
      line_end: 536
      reason: 'Documentation example placeholder password ("your_password"), not a real credential'
    # Doc example: commented-out PostgreSQL config with a placeholder password.
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'docs/docs/Getting-Started/quickstart.md'
      line_start: 264
      line_end: 264
      reason: 'Documentation example placeholder password ("your_password"), not a real credential'
    # Pydantic json_schema_extra example: dummy git commit SHA, not a secret.
    - rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      path: 'src/uaef/experiments/models.py'
      line_start: 245
      line_end: 245
      reason: 'Example git_commit SHA in a Pydantic schema example, not a real secret'
    # --- bandit false positives (verified) -------------------------------
    # File-scoped (line numbers omitted) to stay robust against line drift.
    # demo/backend/main.py: bearer_token param default is "" and the value is
    # read from an env var; flagged only because the name contains "token".
    - rule_id: 'B107'
      path: 'demo/backend/main.py'
      reason: 'bearer_token param default is empty string, not a hardcoded credential'
    - rule_id: 'B105'
      path: 'demo/backend/main.py'
      reason: 'bearer_token is sourced from an env var, not a hardcoded credential'
    # regression.py: match is inside a metric-name -> dimension mapping dict.
    - rule_id: 'B105'
      path: 'src/uaef/experiments/regression.py'
      reason: 'Metric-name dictionary entry (e.g. token_efficiency), not a password string'

    # =====================================================================
    # ACCEPTED RISK (grype) — genuine vulnerabilities with NO upstream fix.
    # These are NOT false positives. They are consciously accepted because a
    # patched release does not exist AND the vulnerable code path is not
    # reachable in UAEF's usage. Scoped to the core `uv.lock` only (the sample
    # templates are handled separately). Each carries an `expiration` so it
    # resurfaces for re-review — if a fix ships before then, bump the dependency
    # and delete the suppression instead of renewing it.
    # =====================================================================
    #
    # ragas — SSRF in the Multi-Modal Faithfulness Collections module.
    #   Advisory : GHSA-95ww-475f-pr4f (severity 6.3)
    #   No fix   : ragas has not released a patched version (constraint is <0.5.0).
    #   Why safe : UAEF never invokes ragas' multi-modal faithfulness feature, so
    #              the SSRF path cannot be triggered by our code or inputs. This
    #              matches the note already recorded in pyproject.toml.
    #   Action   : re-check for a ragas fix by the expiration date below.
    - rule_id: 'GHSA-95ww-475f-pr4f-ragas'
      path: 'uv.lock'
      reason: 'ragas SSRF (GHSA-95ww-475f-pr4f) in the multi-modal faithfulness module; no upstream fix exists and UAEF does not use that module, so the vulnerable path is unreachable. Accepted pending an upstream fix; re-review by expiration.'
      expiration: '2026-10-31'
    #
    # diskcache — unsafe pickle deserialization of cache entries.
    #   Advisory : GHSA-w8v5-vhqr-4h9v (severity 5.2)
    #   No fix   : diskcache has not released a patched version.
    #   Why safe : diskcache is a transitive cache backend (pulled via ragas /
    #              deepeval). It stores and reloads values UAEF itself computes;
    #              it is never fed attacker-controlled data to deserialize, so the
    #              unsafe-unpickle path is not exposed to untrusted input.
    #   Action   : re-check for a diskcache fix by the expiration date below.
    - rule_id: 'GHSA-w8v5-vhqr-4h9v-diskcache'
      path: 'uv.lock'
      reason: 'diskcache unsafe pickle deserialization (GHSA-w8v5-vhqr-4h9v); no upstream fix exists and it is used only as an internal cache for values UAEF computes (never untrusted input), so the path is not exposed. Accepted pending an upstream fix; re-review by expiration.'
      expiration: '2026-10-31'

    # =====================================================================
    # ACCEPTED RISK (grype) — Starlette advisories in the EKS container
    # (deploy_eks/requirements.txt). DEFERRED pending a coordinated upgrade
    # (a fix DOES exist — this is not a no-fix case).
    #
    # Why deferred: a fix requires Starlette >= 1.3.1, but this container pins
    # fastapi==0.115.6, which requires Starlette 0.41.x, and deploy_eks/Dockerfile
    # force-reinstalls that fastapi+starlette pair. Upgrading Starlette therefore
    # requires a coordinated fastapi + starlette + uvicorn bump PLUS functional
    # testing of the FastAPI service — tracked as its own change, not a blind bump.
    #
    # Interim mitigating factors:
    #  - The service is a JSON API and does NOT mount Starlette StaticFiles, so the
    #    StaticFiles SSRF/UNC advisory (GHSA-wqp7-x3pw-xc5r) is not reachable.
    #  - It runs behind an ALB/ingress and requires Cognito JWT auth, limiting
    #    unauthenticated exposure of the DoS / host-header vectors.
    #
    # Resolve by performing the coordinated fastapi/starlette upgrade and DELETING
    # these entries (do not simply renew them). Re-review by the expiration date.
    # =====================================================================
    - rule_id: 'GHSA-7f5h-v6xp-fcq8-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette Range-header O(n^2) DoS (GHSA-7f5h-v6xp-fcq8). Fix >=1.3.1 needs a coordinated fastapi upgrade (fastapi 0.115.6 pins starlette 0.41.x). Deferred; behind ALB + Cognito auth. Re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-82w8-qh3p-5jfq-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette request.form() size limits silently ignored (GHSA-82w8-qh3p-5jfq). Fix >=1.3.1 needs a coordinated fastapi upgrade. Deferred; behind ALB + Cognito auth. Re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-wqp7-x3pw-xc5r-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette StaticFiles SSRF/UNC on Windows (GHSA-wqp7-x3pw-xc5r). Not reachable: the service does not mount StaticFiles and runs on Linux. Fix needs a coordinated fastapi upgrade. Re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-86qp-5c8j-p5mr-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette missing Host-header validation poisoning request.url.path (GHSA-86qp-5c8j-p5mr). Fix needs a coordinated fastapi upgrade. Mitigated by ALB + Cognito auth. Re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-2c2j-9gv5-cj73-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette large-file multipart parsing DoS (GHSA-2c2j-9gv5-cj73). Fix needs a coordinated fastapi upgrade. Mitigated by ALB + Cognito auth. Re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-x746-7m8f-x49c-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette arbitrary HTTP method dispatch via getattr on HTTPEndpoint (GHSA-x746-7m8f-x49c). Fix needs a coordinated fastapi upgrade. Deferred; re-review by expiration.'
      expiration: '2026-10-31'
    - rule_id: 'GHSA-jp82-jpqv-5vv3-starlette'
      path: 'deploy_eks/requirements.txt'
      reason: 'Starlette unvalidated path concatenated into authority poisoning request.url.hostname (GHSA-jp82-jpqv-5vv3). Fix needs a coordinated fastapi upgrade. Mitigated by ALB + Cognito auth. Re-review by expiration.'
      expiration: '2026-10-31'

    # =====================================================================
    # NOT APPLICABLE (checkov) — AWS Lambda container image.
    # uaef-service/docker/worker/Dockerfile is `FROM public.ecr.aws/lambda/python`,
    # an AWS Lambda base image. checkov's generic Docker best-practices do not
    # apply to Lambda images:
    #  - HEALTHCHECK (CKV_DOCKER_2): Lambda ignores Docker healthchecks; container
    #    health/invocation is managed by the Lambda Runtime Interface Client.
    #  - USER (CKV_DOCKER_3): the Lambda execution environment runs the function as
    #    a sandboxed non-privileged user regardless of a Dockerfile USER, and AWS
    #    Lambda base images are not intended to set one (it can break the RIC).
    # These are structural not-applicable cases, not deferred fixes (no expiration).
    # =====================================================================
    # CKV_DOCKER_3 (non-root USER) is now FIXED in the Dockerfile (a non-root
    # `app` user is added), so it is no longer suppressed. Only HEALTHCHECK
    # remains N/A for Lambda images:
    - rule_id: 'CKV_DOCKER_2'
      path: 'uaef-service/docker/worker/Dockerfile'
      reason: 'AWS Lambda container image (FROM public.ecr.aws/lambda/python). Lambda ignores Docker HEALTHCHECK — container health is managed by the Lambda Runtime Interface Client, so a HEALTHCHECK is not applicable.'

    # =====================================================================
    # TEST-CODE false positives (bandit). Test code is STILL fully scanned for
    # real issues; only these definitionally-FP rules are silenced in tests:
    #  - B101 (assert_used): pytest assertions ARE the test mechanism, and test
    #    code is never executed under `python -O`, so the "asserts get stripped
    #    under optimize" concern does not apply to tests.
    #  - B106 (hardcoded_password): dummy 'jwt-token' fixtures in client tests,
    #    not real credentials.
    # =====================================================================
    - rule_id: 'B101'
      path: 'tests/**'
      reason: 'pytest asserts in the root test suite; test code is never run under -O, so the B101 assert-stripping concern does not apply.'
    - rule_id: 'B101'
      path: '**/tests/**'
      reason: 'pytest asserts in subproject test suites (e.g. uaef-service/tests); not run under -O.'
    - rule_id: 'B101'
      path: '**/test_*.py'
      reason: 'pytest asserts in test modules outside tests/ dirs (e.g. uaef-service/handlers/test_*.py); not run under -O.'
    - rule_id: 'B106'
      path: 'tests/**'
      reason: "Dummy 'jwt-token' fixture in client SDK tests, not a real credential."
